services:
  web:
    image: ghcr.io/martythedev-tech/convertly-web:${CONVERTLY_VERSION:-latest}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${CONVERTLY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/martythedev-tech/convertly-api:${CONVERTLY_VERSION:-latest}
    restart: unless-stopped
    pull_policy: always
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

